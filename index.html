<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draconic Sim iOS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <div class="app-container">
        <header>
            <div class="title-area">
                <h1>Draconic Core</h1>
                <span class="version">v2.1</span>
            </div>
            
            <div class="ios-tabs">
                <button class="tab-btn active" onclick="switchTab('reactors')">Реакторы</button>
                <button class="tab-btn" onclick="switchTab('summary')">Сводка</button>
            </div>
        </header>

        <div class="global-controls-bar">
            <div class="ios-segment-control">
                <input type="radio" name="unit" id="unit-sec" checked onchange="toggleUnit(false)">
                <label for="unit-sec">Sec</label>
                
                <input type="radio" name="unit" id="unit-tick" onchange="toggleUnit(true)">
                <label for="unit-tick">Ticks</label>
                
                <div class="segment-slider"></div>
            </div>
            <div class="disclaimer-text">
                Данные актуальны для 20 TPS. Возможна погрешность ~1-2%.
            </div>
        </div>

        <main id="view-reactors" class="view-section active">
            <div id="slots-container" class="slots-grid">
                </div>
        </main>

        <main id="view-summary" class="view-section hidden">
            <div class="glass-panel summary-card">
                <h2>Общая эффективность</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="label">Активных реакторов</span>
                        <span class="value" id="sum-count">0/5</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Общая выработка</span>
                        <span class="value energy" id="sum-gen">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Расход на щиты</span>
                        <span class="value shield" id="sum-shield">0</span>
                    </div>
                    <div class="stat-box highlight">
                        <span class="label">Чистая прибыль</span>
                        <span class="value net" id="sum-net">0</span>
                    </div>
                </div>
                <div class="chart-placeholder">
                    <div class="net-profit-bar">
                        <div class="bar-fill" id="sum-bar" style="width: 0%"></div>
                    </div>
                    <span class="bar-label">Эффективность системы</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
