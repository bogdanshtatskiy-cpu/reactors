<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draconic Simulator 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <div class="title-group">
                    <h1>Draconic Reactor Simulator</h1>
                    <span class="version-badge">v2.0 Beta</span>
                </div>
                <div class="global-controls">
                    <button id="addReactorBtn" class="glass-btn primary-btn">+ Добавить</button>
                    <button id="globalStatsBtn" class="glass-btn">Сводка</button>
                </div>
            </div>
            
            <div class="unit-toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="unitToggle">
                    <span class="slider"></span>
                    <span class="label-text">SEC / TICKS</span>
                </label>
                <div class="disclaimer">
                    ⚠️ Данные актуальны для 20 TPS. Данные не на 100% точные.
                </div>
            </div>
        </header>

        <div id="reactorsGrid" class="reactors-grid">
            <div id="emptyState" class="empty-state">
                <p>Нет активных реакторов</p>
                <p class="sub-text">Нажмите "Добавить" чтобы начать симуляцию</p>
             </div>
        </div>
    </div>

    <div id="globalModal" class="modal-overlay hidden">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Общая сводка</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="label">Всего реакторов</span>
                    <span class="value" id="g-count">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Общая выработка</span>
                    <span class="value energy" id="g-gen">0 RF/t</span>
                </div>
                <div class="stat-box">
                    <span class="label">Расход на щиты</span>
                    <span class="value shield" id="g-shield">0 RF/t</span>
                </div>
                <div class="stat-box">
                    <span class="label">Чистая прибыль</span>
                    <span class="value net" id="g-net">0 RF/t</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
